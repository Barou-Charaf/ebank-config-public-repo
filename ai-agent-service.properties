# Server
server.port=8085

# Ollama AI
spring.ai.openai.base-url=https://ollama.com/v1
spring.ai.openai.chat.options.model=gemma4:31b

# MCP Client
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=ai-agent-mcp-client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialized=true
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.toolcallback.enabled=true

# Customer MCP Server via Gateway + Eureka
spring.ai.mcp.client.streamable-http.connections.customer-service.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.customer-service.endpoint=/mcp

spring.ai.mcp.client.streamable-http.connections.bank-service.url=http://localhost:8082
spring.ai.mcp.client.streamable-http.connections.bank-service.endpoint=/mcp


# Debugging
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.io.modelcontextprotocol=DEBUG